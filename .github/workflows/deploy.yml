name: Deploy docs to GitHub Pages

on:
  # 當有程式碼推送到 main 分支時自動執行
  push:
    branches: ["main"]

  # 允許你在 GitHub Actions 網頁上手動點擊執行
  workflow_dispatch:

# 必須明確給予權限（id-token 給部署用，actions: read 讓 deploy-pages 讀得到 artifact）
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# 確保不會有兩個部署同時進行發生衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 第一個 job：只負責打包上傳
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 指定你要部署的資料夾是 docs
          path: './docs'
          # 每次重跑（run_attempt）用不同名字，避免同一個 run 裡出現兩個同名 artifact
          name: github-pages-${{ github.run_attempt }}

  # 第二個 job：等 build 完成後才部署，這時 artifact 一定已經查得到
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}